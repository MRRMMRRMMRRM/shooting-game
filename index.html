/* ─── 効果音（Web Audio API） ─── */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  const t0 = audioCtx.currentTime;

  if(type === 'beam') {
    // 戦車の発砲音：低い爆発的な「ドン」＋余韻
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.type = 'sawtooth';
    o1.frequency.setValueAtTime(120, t0);
    o1.frequency.exponentialRampToValueAtTime(40, t0 + 0.12);
    g1.gain.setValueAtTime(0.35, t0);
    g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
    o1.start(t0); o1.stop(t0 + 0.18);
    // 高周波の金属音を重ねる
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.connect(g2); g2.connect(audioCtx.destination);
    o2.type = 'square';
    o2.frequency.setValueAtTime(800, t0);
    o2.frequency.exponentialRampToValueAtTime(200, t0 + 0.06);
    g2.gain.setValueAtTime(0.1, t0);
    g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
    o2.start(t0); o2.stop(t0 + 0.06);

  } else if(type === 'block') {
    // 木が燃える音：バチッ＋パチパチとした音
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.type = 'sawtooth';
    o1.frequency.setValueAtTime(600, t0);
    o1.frequency.exponentialRampToValueAtTime(80, t0 + 0.25);
    g1.gain.setValueAtTime(0.28, t0);
    g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
    o1.start(t0); o1.stop(t0 + 0.25);
    // パチパチ
    [0.05, 0.1, 0.17].forEach(dt => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'square';
      o.frequency.setValueAtTime(300 + Math.random()*200, t0+dt);
      g.gain.setValueAtTime(0.1, t0+dt);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dt+0.04);
      o.start(t0+dt); o.stop(t0+dt+0.04);
    });

  } else if(type === 'enemy') {
    // 宇宙モンスター撃破：不気味な電子音で消滅
    [0, 0.08, 0.18].forEach((dt, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = i === 1 ? 'sine' : 'triangle';
      const freq = [440, 220, 110][i];
      o.frequency.setValueAtTime(freq * 1.5, t0+dt);
      o.frequency.exponentialRampToValueAtTime(freq * 0.3, t0+dt+0.2);
      g.gain.setValueAtTime(0.2, t0+dt);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dt+0.2);
      o.start(t0+dt); o.stop(t0+dt+0.2);
    });

  } else if(type === 'hit') {
    // 強敵へのダメージ：重い鈍打音
    const o1 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    o1.connect(g1); g1.connect(audioCtx.destination);
    o1.type = 'sawtooth';
    o1.frequency.setValueAtTime(180, t0);
    o1.frequency.exponentialRampToValueAtTime(60, t0 + 0.15);
    g1.gain.setValueAtTime(0.3, t0);
    g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
    o1.start(t0); o1.stop(t0 + 0.15);

  } else if(type === 'clear') {
    // ステージクリア：勝利ファンファーレ（軍楽的な上昇）
    const notes = [392, 523, 659, 784, 1046];
    notes.forEach((freq, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = i < 3 ? 'square' : 'sine';
      const t = t0 + i * 0.1;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.2, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.18);
    });
    return;

  } else if(type === 'gameover') {
    // ゲームオーバー：重厚な失敗音（低音が落ちていく）
    [[220, 0], [160, 0.2], [100, 0.45], [60, 0.7]].forEach(([freq, dt]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(freq, t0+dt);
      o.frequency.exponentialRampToValueAtTime(freq*0.5, t0+dt+0.2);
      g.gain.setValueAtTime(0.28, t0+dt);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dt+0.22);
      o.start(t0+dt); o.stop(t0+dt+0.22);
    });
    return;
  }
}

/* ─── 定数 ─── */
const PLAYER_SPEED = 4;
const PLAYER_R     = 16;
const ENEMY_R      = 20;
const BEAM_SPEED   = 12;
const BEAM_LEN     = 28;
const BS = 40; // 外枠ブロックのサイズ（正方形）

/* ─── ボス定数 ─── */
const BOSS_STAGE    = 10;
const BOSS_R        = PLAYER_R * 5;
const BOSS_MAX_HP   = 100;
const BOSS_BASE_SPD = 0.8;
const SLOW_RATE     = 0.12; // スロー中の速度倍率
const SLOW_FRAMES   = 30;  // スロー継続フレーム数（約0.5秒）

function makeBoss() {
  return {
    x: W / 2, y: H / 2,
    vx: BOSS_BASE_SPD, vy: BOSS_BASE_SPD * 0.7,
    hp: BOSS_MAX_HP, maxHp: BOSS_MAX_HP,
    isBoss: true, alive: true,
  };
}

function bossSpeed(hp) {
  const t = 1 - hp / BOSS_MAX_HP;
  return BOSS_BASE_SPD + t * 3.2;
}

function spawnFromBoss(boss, count, spd) {
  const spawned = [];
  for(let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
    const dist  = BOSS_R + ENEMY_R * 2;
    const hp    = Math.random() < 0.4 ? 3 : 1;
    spawned.push({
      x: boss.x + Math.cos(angle) * dist,
      y: boss.y + Math.sin(angle) * dist,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      hp, maxHp: hp,
    });
  }
  return spawned;
}

/* 外枠：消えるブロックを端に敷き詰める（gapRate=歯抜け率 0.0〜1.0） */
function makeBorderBlocks(gapRate = 0) {
  const out = [];
  const cols = Math.floor(W / BS);
  const rows = Math.floor(H / BS);
  for(let c=0; c<cols; c++) {
    if(Math.random() >= gapRate) out.push({x: c*BS, y: 0,    w: BS, h: BS, alive: true});
    if(Math.random() >= gapRate) out.push({x: c*BS, y: H-BS, w: BS, h: BS, alive: true});
  }
  for(let r=1; r<rows-1; r++) {
    if(Math.random() >= gapRate) out.push({x: 0,    y: r*BS, w: BS, h: BS, alive: true});
    if(Math.random() >= gapRate) out.push({x: W-BS, y: r*BS, w: BS, h: BS, alive: true});
  }
  return out;
}

/* ステージごとの歯抜け率（0.0=全部あり、1.0=全部なし） */
const BORDER_GAP = [
  0.15, // ステージ1：少し歯抜け
  0.20, // ステージ2
  0.28, // ステージ3
  0.35, // ステージ4
  0.42, // ステージ5
  0.50, // ステージ6：半分程度
  0.57, // ステージ7
  0.65, // ステージ8
  0.72, // ステージ9
  0.80, // ステージ10：かなり歯抜け
];

/* ─── 初期化 ─── */
const MIN_SPAWN_DIST = 180; // プレイヤーと敵の最低距離

function initStage(s) {
  const def = STAGES[s];
  player = { x: BS*2, y: BS*2, angle: 0, bodyAngle: 0 };

  /* 敵の初期位置をプレイヤーから一定距離離す */
  enemies = def.enemies.map(e => {
    const ne = {...e, hp: e.hp || 1, maxHp: e.hp || 1};
    let nx = ne.x, ny = ne.y;
    const dx = nx - player.x, dy = ny - player.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < MIN_SPAWN_DIST) {
      const angle = Math.atan2(dy, dx);
      nx = player.x + Math.cos(angle) * MIN_SPAWN_DIST;
      ny = player.y + Math.sin(angle) * MIN_SPAWN_DIST;
      // 画面内に収める
      nx = Math.max(BS + ENEMY_R, Math.min(W - BS - ENEMY_R, nx));
      ny = Math.max(BS + ENEMY_R, Math.min(H - BS - ENEMY_R, ny));
    }
    return {...ne, x: nx, y: ny};
  });

  blocks  = [
    ...makeBorderBlocks(BORDER_GAP[s] || 0),
    ...def.blocks.map(b => ({...b, alive:true}))
  ];
  beams   = [];
  particles = [];
  hudStage.textContent = s + 1;
  updateHUD();
}

/* ─── ボスステージ初期化 ─── */
function initBossStage() {
  player  = { x: BS*2, y: H/2, angle: 0, bodyAngle: 0 };
  enemies = [ makeBoss() ];
  blocks  = makeBorderBlocks();
  beams   = [];
  particles = [];
  hudStage.textContent = 'BOSS';
  updateHUD();
}

function updateHUD() {
  hudEnemy.textContent = enemies.filter(e=>e.alive!==false).length;
}

/* ─── タイマー ─── */
function startTimer() {
  clearInterval(timerInterval);
  // 制限時間なし
}

/* ─── 入力 ─── */
document.addEventListener('keydown', e => { keys[e.key] = true; startFromTitle(); });
document.addEventListener('keyup',   e => { keys[e.key] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) / scale;
  mouseY = (e.clientY - r.top)  / scale;
});
canvas.addEventListener('click', () => {
  startFromTitle();
  if(state !== 'playing' && state !== 'tutorial') return;
  fireBeam();
});

/* ─── タッチ操作（canvas下のコントロールパネル） ─── */
const isMobile = () => window.matchMedia('(pointer: coarse)').matches;
const controlsEl   = document.getElementById('controls');
const joystickBase = document.getElementById('joystick-base');
const joystickStick= document.getElementById('joystick-stick');
const shootBtn     = document.getElementById('shoot-btn');
const STICK_MAX = 40;

let joyActive = false, joyId = null;
let joyDx = 0, joyDy = 0;

function showJoystick() {
  if(isMobile()) {
    controlsEl.style.display = 'flex';
    document.getElementById('hint').style.display = 'none';
  }
}

/* タイトル画面でのタッチ開始 */
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  startFromTitle();
}, {passive: false});

/* ジョイスティック操作 */
joystickBase.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if(joyId !== null) return;
  joyId = t.identifier;
  joyActive = true;
  updateStick(t);
}, {passive: false});

joystickBase.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches) {
    if(t.identifier !== joyId) continue;
    updateStick(t);
  }
}, {passive: false});

joystickBase.addEventListener('touchend', e => {
  e.preventDefault();
  for(const t of e.changedTouches) {
    if(t.identifier !== joyId) continue;
    joyId = null; joyActive = false;
    joyDx = 0; joyDy = 0;
    joystickStick.style.transform = 'translate(-50%, -50%)';
  }
}, {passive: false});

function updateStick(t) {
  const r = joystickBase.getBoundingClientRect();
  const cx = r.left + r.width  / 2;
  const cy = r.top  + r.height / 2;
  const dx = t.clientX - cx;
  const dy = t.clientY - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const clamped = Math.min(dist, STICK_MAX);
  const angle = Math.atan2(dy, dx);
  joyDx = Math.cos(angle) * clamped / STICK_MAX;
  joyDy = Math.sin(angle) * clamped / STICK_MAX;
  const sx = 50 + joyDx * STICK_MAX;
  const sy = 50 + joyDy * STICK_MAX;
  joystickStick.style.transform = `translate(calc(${sx}% - 50%), calc(${sy}% - 50%))`;
  joystickStick.style.left = sx + '%';
  joystickStick.style.top  = sy + '%';
}

/* 発射ボタン：プレイヤーから最寄りの敵に向けて自動照準して発射 */
shootBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  if(state !== 'playing') return;
  audioCtx.resume();
  // 生き残っている敵の中で最も近い敵に自動照準
  const alive = enemies.filter(en => en.alive !== false);
  if(alive.length > 0) {
    let target = alive[0];
    let minD = Infinity;
    for(const en of alive) {
      const d = (en.x-player.x)**2 + (en.y-player.y)**2;
      if(d < minD) { minD = d; target = en; }
    }
    mouseX = target.x;
    mouseY = target.y;
  }
  fireBeam();
}, {passive: false});

function fireBeam() {
  playSound('beam');
  const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
  beams.push({
    x: player.x + Math.cos(angle)*(PLAYER_R+2),
    y: player.y + Math.sin(angle)*(PLAYER_R+2),
    vx: Math.cos(angle)*BEAM_SPEED,
    vy: Math.sin(angle)*BEAM_SPEED,
    angle,
    alive: true
  });
}

/* ─── 更新 ─── */
function update() {
  /* スローモーション処理 */
  if(state === 'slowing') {
    slowTimer--;
    // 残り時間の割合（1.0→0.0）
    const t = slowTimer / SLOW_FRAMES;
    // 前半は等速、後半にかけてスローになるイージング（t^3で急激に落ちる）
    const rate = SLOW_RATE + (1.0 - SLOW_RATE) * Math.pow(t, 3);
    for(const p of particles) {
      p.x += p.vx * rate;
      p.y += p.vy * rate;
      p.vx *= 0.92;
      p.vy *= 0.92;
      p.life -= p.decay * rate;
    }
    particles = particles.filter(p => p.life > 0);

    /* dieAtカウントダウン（スロー中も継続） */
    for(const e of enemies) {
      if(e.alive === false || e.dieAt === undefined) continue;
      if(e.dieAt <= 0) {
        e.alive = false;
        e.dieAt = undefined;
        playSound('enemy');
        const col = e.maxHp > 1 ? '#aa00ff' : '#2979ff';
        spawnParticles(e.x, e.y, col, e.maxHp > 1 ? 12 : 8, 4);
      } else {
        e.dieAt--;
      }
    }

    const bossFinished = stage === BOSS_STAGE
      ? enemies.every(e => e.alive === false) && particles.length === 0
      : true;
    if(slowTimer <= 0 && bossFinished) {
      slowClearFn && slowClearFn();
      slowClearFn = null;
    }
    return;
  }
  if(state !== 'playing') return;

  /* プレイヤー移動（キーボード＋ジョイスティック） */
  const spd = PLAYER_SPEED;
  let moveX = 0, moveY = 0;
  if(keys['w']||keys['W']||keys['ArrowUp'])    moveY -= 1;
  if(keys['s']||keys['S']||keys['ArrowDown'])  moveY += 1;
  if(keys['a']||keys['A']||keys['ArrowLeft'])  moveX -= 1;
  if(keys['d']||keys['D']||keys['ArrowRight']) moveX += 1;
  if(joyActive) { moveX += joyDx; moveY += joyDy; }
  if(moveX !== 0 || moveY !== 0) {
    const len = Math.sqrt(moveX*moveX + moveY*moveY);
    player.x = Math.max(PLAYER_R, Math.min(W-PLAYER_R, player.x + (moveX/len)*spd));
    player.y = Math.max(PLAYER_R, Math.min(H-PLAYER_R, player.y + (moveY/len)*spd));
    player.bodyAngle = Math.atan2(moveY, moveX); // 車体は移動方向を向く
  }
  player.angle = Math.atan2(mouseY - player.y, mouseX - player.x); // 砲塔はマウス方向

  /* ブロックとのめり込み補正（プレイヤー） */
  for(const b of blocks) {
    if(!b.alive) continue;
    resolveCircleRect(player, PLAYER_R, b);
  }

  /* ビーム更新 */
  for(const beam of beams) {
    if(!beam.alive) continue;
    beam.x += beam.vx;
    beam.y += beam.vy;
    if(beam.x<0||beam.x>W||beam.y<0||beam.y>H) { beam.alive=false; continue; }

    /* ビームとブロック */
    for(const b of blocks) {
      if(!b.alive) continue;
      if(rectContains(b, beam.x, beam.y)) {
        b.alive = false;
        beam.alive = false;
        playSound('block');
        // 燃えるエフェクト
        spawnFireParticles(beam.x, beam.y);
        break;
      }
    }
    if(!beam.alive) continue;

    /* ビームと敵・ボス */
    for(const e of enemies) {
      if(e.alive===false) continue;
      const dx = beam.x - e.x, dy = beam.y - e.y;
      const r = e.isBoss ? BOSS_R : (e.maxHp > 1 ? ENEMY_R * 1.3 : ENEMY_R);
      if(dx*dx+dy*dy < r*r) {
        e.hp--;
        beam.alive = false;
        if(e.hp <= 0) {
          e.alive = false;
          playSound('enemy');
          const col = e.isBoss ? '#ff6d00' : (e.maxHp > 1 ? '#aa00ff' : '#2979ff');
          const cnt = e.isBoss ? 20 : (e.maxHp > 1 ? 12 : 8);
          spawnParticles(e.x, e.y, col, cnt, e.isBoss ? 6 : 4);
          // ボス撃破時：雑魚敵に数フレームずらして倒れるタイマーをセット
          if(e.isBoss) {
            let delay = 0;
            for(const m of enemies) {
              if(!m.isBoss && m.alive !== false) {
                m.dieAt = delay + Math.floor(Math.random() * 4);
                delay += 3 + Math.floor(Math.random() * 4);
              }
            }
          }
        } else {
          playSound('hit');
          // ボスはHP5減るたびに敵を放出
          if(e.isBoss && e.hp % 5 === 0) {
            if(e.hp > 50) {
              // フェーズ1：1体放出（HP1かHP3）
              const sp = Math.random() < 0.4 ? 3 : 1;
              const spd = 1.5;
              const ang = Math.random() * Math.PI * 2;
              enemies.push({
                x: e.x + Math.cos(ang)*(BOSS_R + ENEMY_R*2),
                y: e.y + Math.sin(ang)*(BOSS_R + ENEMY_R*2),
                vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
                hp: sp, maxHp: sp,
              });
            } else {
              // フェーズ2：3〜5体を高速放出
              const count = 3 + Math.floor(Math.random() * 3);
              const spd   = 2.5 + Math.random();
              const spawned = spawnFromBoss(e, count, spd);
              for(const s of spawned) enemies.push(s);
            }
          }
        }
        break;
      }
    }
  }
  beams = beams.filter(b=>b.alive);

  /* 敵更新 */
  const toSpawn = [];
  for(const e of enemies) {
    if(e.alive===false) continue;

    /* dieAtタイマー（ボス撃破後の雑魚敵連鎖消滅） */
    if(e.dieAt !== undefined) {
      if(e.dieAt <= 0) {
        e.alive = false;
        e.dieAt = undefined;
        playSound('enemy');
        const col = e.maxHp > 1 ? '#aa00ff' : '#2979ff';
        spawnParticles(e.x, e.y, col, e.maxHp > 1 ? 12 : 8, 4);
        continue;
      }
      e.dieAt--;
    }

    // ボスは速度をHPに応じて動的に更新
    if(e.isBoss) {
      const spd = bossSpeed(e.hp);
      const cur = Math.sqrt(e.vx*e.vx + e.vy*e.vy);
      if(cur > 0) { e.vx = e.vx/cur*spd; e.vy = e.vy/cur*spd; }
    }

    e.x += e.vx;
    e.y += e.vy;

    /* ブロックバウンス */
    const er = e.isBoss ? BOSS_R : (e.maxHp > 1 ? ENEMY_R*1.3 : ENEMY_R);
    for(const b of blocks) {
      if(!b.alive) continue;
      bounceCircleRect(e, er, b);
    }

    /* 画面外チェック → ゲームオーバーではなく2倍スポーン */
    /* ボスは画面外に出たら反対側からワープして戻る */
    if(e.isBoss) {
      if(e.x < -BOSS_R)  e.x = W + BOSS_R;
      if(e.x > W+BOSS_R) e.x = -BOSS_R;
      if(e.y < -BOSS_R)  e.y = H + BOSS_R;
      if(e.y > H+BOSS_R) e.y = -BOSS_R;
    } else if(e.x < -ENEMY_R || e.x > W+ENEMY_R || e.y < -ENEMY_R || e.y > H+ENEMY_R) {
      e.alive = false;
      // 出た辺を判定してスポーン位置と侵入方向を決める
      for(let i = 0; i < 2; i++) {
        const spd = Math.sqrt(e.vx*e.vx + e.vy*e.vy);
        let sx, sy, svx, svy;
        // 出た辺に応じて反対側の辺からスポーン
        if(e.x < -ENEMY_R) {
          // 左から出た → 右辺からスポーン
          sx = W - BS - ENEMY_R;
          sy = BS + ENEMY_R + Math.random() * (H - BS*2 - ENEMY_R*2);
          const angle = Math.PI + (Math.random()-0.5) * 0.8;
          svx = Math.cos(angle) * spd;
          svy = Math.sin(angle) * spd;
        } else if(e.x > W+ENEMY_R) {
          // 右から出た → 左辺からスポーン
          sx = BS + ENEMY_R;
          sy = BS + ENEMY_R + Math.random() * (H - BS*2 - ENEMY_R*2);
          const angle = (Math.random()-0.5) * 0.8;
          svx = Math.cos(angle) * spd;
          svy = Math.sin(angle) * spd;
        } else if(e.y < -ENEMY_R) {
          // 上から出た → 下辺からスポーン
          sx = BS + ENEMY_R + Math.random() * (W - BS*2 - ENEMY_R*2);
          sy = H - BS - ENEMY_R;
          const angle = -Math.PI/2 + (Math.random()-0.5) * 0.8;
          svx = Math.cos(angle) * spd;
          svy = Math.sin(angle) * spd;
        } else {
          // 下から出た → 上辺からスポーン
          sx = BS + ENEMY_R + Math.random() * (W - BS*2 - ENEMY_R*2);
          sy = BS + ENEMY_R;
          const angle = Math.PI/2 + (Math.random()-0.5) * 0.8;
          svx = Math.cos(angle) * spd;
          svy = Math.sin(angle) * spd;
        }
        toSpawn.push({ x:sx, y:sy, vx:svx, vy:svy, hp:e.maxHp, maxHp:e.maxHp });
      }
      playSound('hit'); // スポーン警告音
      continue;
    }

    /* プレイヤーへの衝突チェック */
    const collR = e.isBoss ? BOSS_R : (e.maxHp > 1 ? ENEMY_R * 1.3 : ENEMY_R);
    const pdx = e.x - player.x, pdy = e.y - player.y;
    if(pdx*pdx+pdy*pdy < (collR+PLAYER_R)*(collR+PLAYER_R)) {
      triggerGameOver('やられた！');
      return;
    }
  }
  // スポーン分を追加
  for(const ne of toSpawn) enemies.push(ne);

  /* クリア判定 */
  const isCleared = stage === BOSS_STAGE
    ? enemies.some(e => e.isBoss && e.alive === false)  // ボスステージ：ボスを倒せばOK
    : enemies.every(e => e.alive === false);             // 通常ステージ：全敵撃破
  if(isCleared) {
    clearInterval(timerInterval);
    state = 'slowing';
    slowTimer = SLOW_FRAMES;
    if(stage + 1 < STAGES.length) {
      slowClearFn = () => {
        stage++;
        initStage(stage);
        hudStage.textContent = stage + 1;
        playSound('clear');
        showOverlay('ステージクリア！', `次のステージへ進みます。\nステージ ${stage+1} 開始！`, 'ステージ ' + (stage+1));
        state = 'clear';
      };
    } else if(stage === STAGES.length - 1) {
      slowClearFn = () => {
        stage = BOSS_STAGE;
        initBossStage();
        playSound('clear');
        showOverlay('⚠️ ラスボス出現！', '全ステージを制覇した！\nしかし…最後の敵が待ち構えている！', 'ボスに挑む！');
        state = 'clear';
      };
    } else {
      slowClearFn = () => {
        playSound('clear');
        showOverlay('🎉 ゲームクリア！', 'ラスボスを倒した！\n完全制覇おめでとうございます！', 'もう一度遊ぶ');
        const shareArea = document.getElementById('shareArea');
        const shareX    = document.getElementById('shareX');
        const gameUrl   = location.href;
        const text = `ラスボスを倒して完全制覇しました！🎮💥 ブラウザで遊べる2Dシューティングゲーム、あなたも挑戦してみて！ #2Dシューティング #ゲーム制作`;
        shareX.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(gameUrl)}`;
        shareArea.style.display = 'block';
        state = 'clear';
      };
    }
  }

  /* パーティクル更新（playing中） */
  for(const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);

  updateHUD();
}

/* ─── 当たり判定ユーティリティ ─── */
function rectContains(b, x, y) {
  return x >= b.x && x <= b.x+b.w && y >= b.y && y <= b.y+b.h;
}

function resolveCircleRect(obj, r, b) {
  const cx = obj.x, cy = obj.y;
  const nx = Math.max(b.x, Math.min(cx, b.x+b.w));
  const ny = Math.max(b.y, Math.min(cy, b.y+b.h));
  const dx = cx-nx, dy = cy-ny;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if(dist < r && dist > 0) {
    const push = (r-dist)/dist;
    obj.x += dx*push;
    obj.y += dy*push;
  }
}

function bounceCircleRect(e, r, b) {
  const cx = e.x, cy = e.y;
  const nx = Math.max(b.x, Math.min(cx, b.x+b.w));
  const ny = Math.max(b.y, Math.min(cy, b.y+b.h));
  const dx = cx-nx, dy = cy-ny;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if(dist < r && dist > 0) {
    /* 押し出し */
    const push = (r-dist)/dist;
    e.x += dx*push;
    e.y += dy*push;
    /* 衝突前の位置でどちらの面に当たったか判定 */
    const prevX = cx - e.vx;
    const prevY = cy - e.vy;
    const wasOutsideX = prevX < b.x - r + 1 || prevX > b.x + b.w + r - 1;
    const wasOutsideY = prevY < b.y - r + 1 || prevY > b.y + b.h + r - 1;
    if(wasOutsideX && !wasOutsideY) {
      e.vx = -e.vx;
    } else if(wasOutsideY && !wasOutsideX) {
      e.vy = -e.vy;
    } else {
      /* 斜め衝突：めり込み量が大きい軸で反射 */
      const overlapX = r - Math.abs(dx);
      const overlapY = r - Math.abs(dy);
      if(overlapX < overlapY) e.vx = -e.vx;
      else e.vy = -e.vy;
    }
  }
}

/* ─── パーティクル ─── */
function spawnParticles(x, y, color, count, speed) {
  for(let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + Math.random() * 0.3;
    const spd   = speed * (0.6 + Math.random() * 0.8);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      r: 4 + Math.random() * 4,
      life: 1.0,   // 1.0 → 0.0 でフェードアウト
      decay: 0.04 + Math.random() * 0.03,
      color,
    });
  }
}

function spawnFireParticles(x, y) {
  const colors = ['#ff1744', '#ff6d00', '#ffd600', '#ff9100', '#ff3d00'];
  for(let i = 0; i < 18; i++) {
    const angle = -Math.PI/2 + (Math.random()-0.5) * Math.PI; // 上方向にランダム
    const spd   = 1.5 + Math.random() * 3;
    colors.forEach((col, ci) => {
      if(ci !== Math.floor(Math.random() * colors.length)) return;
      particles.push({
        x: x + (Math.random()-0.5)*10,
        y: y + (Math.random()-0.5)*10,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 1,
        r: 3 + Math.random() * 5,
        life: 0.9 + Math.random() * 0.1,
        decay: 0.025 + Math.random() * 0.025,
        color: col,
        isFire: true,
      });
    });
  }
}

/* ─── 描画 ─── */
function draw() {
  ctx.clearRect(0,0,W,H);

  /* 背景 */
  ctx.fillStyle = '#f5f0e8';
  ctx.fillRect(0,0,W,H);

  /* ドットグリッド */
  ctx.fillStyle = '#ccc';
  for(let x=20;x<W;x+=30) for(let y=20;y<H;y+=30)
    ctx.fillRect(x,y,2,2);

  /* 木（ブロック） */
  for(const b of blocks) {
    if(!b.alive) continue;
    const cx = b.x + b.w/2;
    const cy = b.y + b.h/2;
    const r  = b.w * 0.42;

    ctx.save();

    /* 幹 */
    ctx.fillStyle = '#795548';
    ctx.fillRect(cx - r*0.22, cy, r*0.44, r*0.7);
    /* 幹の木目 */
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(cx - r*0.1, cy, r*0.08, r*0.7);

    /* 葉っぱ（下の層） */
    ctx.fillStyle = '#388e3c';
    ctx.beginPath();
    ctx.arc(cx, cy + r*0.1, r*0.82, 0, Math.PI*2);
    ctx.fill();

    /* 葉っぱ（上の層） */
    ctx.fillStyle = '#43a047';
    ctx.beginPath();
    ctx.arc(cx, cy - r*0.15, r*0.65, 0, Math.PI*2);
    ctx.fill();

    /* 葉っぱ（一番上） */
    ctx.fillStyle = '#66bb6a';
    ctx.beginPath();
    ctx.arc(cx, cy - r*0.4, r*0.42, 0, Math.PI*2);
    ctx.fill();

    /* ハイライト */
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.arc(cx - r*0.2, cy - r*0.45, r*0.2, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  /* ビーム */
  for(const beam of beams) {
    ctx.save();
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ffec6e';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(beam.x - Math.cos(beam.angle)*BEAM_LEN,
               beam.y - Math.sin(beam.angle)*BEAM_LEN);
    ctx.lineTo(beam.x, beam.y);
    ctx.stroke();
    ctx.restore();
  }

  /* 敵・ボス */
  for(const e of enemies) {
    if(e.alive===false) continue;

    /* ─── ボス描画 ─── */
    if(e.isBoss) {
      const r = BOSS_R;
      const hpRatio = e.hp / BOSS_MAX_HP;
      // フェーズで色変化：HP高→深紅、HP低→黄
      const red   = 180 + Math.round((1-hpRatio)*75);
      const green = Math.round(hpRatio * 30);
      ctx.save();
      // 外輪（オーラ）
      ctx.strokeStyle = hpRatio > 0.5 ? 'rgba(180,0,255,0.5)' : 'rgba(255,80,0,0.6)';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(e.x, e.y, r+10, 0, Math.PI*2); ctx.stroke();
      // 本体
      ctx.fillStyle = `rgb(${red},${green},30)`;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI*2); ctx.fill();
      // ハイライト
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.ellipse(e.x-r*0.3, e.y-r*0.3, r*0.35, r*0.25, -Math.PI/4, 0, Math.PI*2); ctx.fill();
      // 怒り目
      const eyeOff = r * 0.28, eyeR = r*0.18, pupilR = r*0.10;
      ctx.fillStyle = '#ff0'; 
      ctx.beginPath(); ctx.arc(e.x-eyeOff, e.y-eyeOff*0.4, eyeR, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x+eyeOff, e.y-eyeOff*0.4, eyeR, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(e.x-eyeOff, e.y-eyeOff*0.4, pupilR, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.x+eyeOff, e.y-eyeOff*0.4, pupilR, 0, Math.PI*2); ctx.fill();
      // HPバー
      const barW = r * 2, barH = 10;
      const barX = e.x - r, barY = e.y + r + 10;
      ctx.fillStyle = '#333';
      ctx.fillRect(barX, barY, barW, barH);
      ctx.fillStyle = hpRatio > 0.5 ? '#e53935' : '#ff9800';
      ctx.fillRect(barX, barY, barW * hpRatio, barH);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barY, barW, barH);
      // HP数値
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(r*0.4)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(e.hp, e.x, e.y);
      // フェーズ表示
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = hpRatio > 0.5 ? '#cc80ff' : '#ff9800';
      ctx.fillText(hpRatio > 0.5 ? 'PHASE 1' : '⚠ PHASE 2', e.x, barY + barH + 14);
      ctx.restore();
      continue;
    }

    const isTough = e.maxHp > 1;
    const r = isTough ? ENEMY_R * 1.3 : ENEMY_R;

    ctx.save();
    ctx.translate(e.x, e.y);

    // HP別カラー設定
    let bodyColor, glowColor, darkColor;
    if(!isTough) {
      bodyColor = '#1a237e'; darkColor = '#0d1257'; glowColor = '#7986cb';
    } else if(e.hp === 3) {
      bodyColor = '#4a148c'; darkColor = '#2a0a5e'; glowColor = '#ce93d8';
    } else if(e.hp === 2) {
      bodyColor = '#b71c1c'; darkColor = '#7f0000'; glowColor = '#ef9a9a';
    } else {
      bodyColor = '#e65100'; darkColor = '#8c3200'; glowColor = '#ffcc80';
    }

    /* 発光オーラ */
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 14;

    /* 不定形ボディ（正方形いっぱいに広がるブロブ形状） */
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    // 8点の制御点でぐにょっとした形を作る
    const s = r; // 半径をそのまま使用
    ctx.moveTo(s*0.6, 0);
    ctx.bezierCurveTo( s*1.0,  -s*0.3,  s*1.0,  -s*0.9,  s*0.3,  -s*0.95);
    ctx.bezierCurveTo( s*0.0,  -s*1.05, -s*0.5, -s*1.0,  -s*0.7, -s*0.6);
    ctx.bezierCurveTo(-s*1.05, -s*0.2,  -s*1.0,  s*0.4,  -s*0.6,  s*0.7);
    ctx.bezierCurveTo(-s*0.3,   s*1.05,  s*0.3,  s*1.0,   s*0.65,  s*0.7);
    ctx.bezierCurveTo( s*1.0,   s*0.4,   s*0.9, -s*0.1,   s*0.6,   0);
    ctx.closePath();
    ctx.fill();

    /* 表面の暗い斑紋 */
    ctx.shadowBlur = 0;
    ctx.fillStyle = darkColor;
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(-r*0.2,  r*0.3,  r*0.3, r*0.2,  0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( r*0.3, -r*0.4,  r*0.2, r*0.15, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    /* 表面の発光斑点 */
    ctx.fillStyle = glowColor;
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(-r*0.4, -r*0.5, r*0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( r*0.35, r*0.45, r*0.1,  0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-r*0.1,  r*0.6,  r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    /* 目1（大・中央やや上） */
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0, -r*0.1, r*0.48, r*0.38, 0, 0, Math.PI*2); ctx.fill();
    const eyeAngle = Math.atan2(player.y - e.y, player.x - e.x);
    ctx.fillStyle = glowColor;
    ctx.beginPath(); ctx.arc(
      Math.cos(eyeAngle)*r*0.14, -r*0.1 + Math.sin(eyeAngle)*r*0.1,
      r*0.27, 0, Math.PI*2
    ); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(
      Math.cos(eyeAngle)*r*0.14, -r*0.1 + Math.sin(eyeAngle)*r*0.1,
      r*0.15, 0, Math.PI*2
    ); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-r*0.1, -r*0.28, r*0.09, 0, Math.PI*2); ctx.fill();

    /* HP表示（強敵のみ） */
    if(isTough) {
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(r*0.4)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(e.hp, 0, r*0.55);
    }

    ctx.restore();
  }

  /* プレイヤー（戦車） */
  const R = PLAYER_R;

  /* ── 車体（移動方向を向く） ── */
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.bodyAngle);

  /* キャタピラ（左右） */
  ctx.fillStyle = '#424242';
  ctx.fillRect(-R, -R*1.1, R*2, R*0.55);
  ctx.fillRect(-R, R*0.55, R*2, R*0.55);
  /* キャタピラのコマ模様 */
  ctx.fillStyle = '#616161';
  for(let i = -R+4; i < R; i += 8) {
    ctx.fillRect(i, -R*1.1+2, 5, R*0.55-4);
    ctx.fillRect(i, R*0.55+2, 5, R*0.55-4);
  }

  /* 車体 */
  ctx.fillStyle = '#78909c';
  ctx.fillRect(-R*0.85, -R*0.55, R*1.7, R*1.1);
  ctx.fillStyle = '#546e7a';
  ctx.fillRect(-R*0.85, -R*0.55, R*1.7, R*0.15);
  ctx.fillRect(-R*0.85, R*0.4,   R*1.7, R*0.15);

  ctx.restore();

  /* ── 砲塔＋砲身（マウス方向を向く） ── */
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.angle);

  /* 砲身 */
  ctx.fillStyle = '#546e7a';
  ctx.fillRect(R*0.55, -R*0.1, R*0.95, R*0.2);
  ctx.fillStyle = '#37474f';
  ctx.fillRect(R*1.45, -R*0.14, R*0.15, R*0.28);

  /* 砲塔 */
  ctx.fillStyle = '#90a4ae';
  ctx.beginPath();
  ctx.ellipse(0, 0, R*0.6, R*0.5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#546e7a';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  /* ハイライト */
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.ellipse(-R*0.1, -R*0.1, R*0.3, R*0.2, -0.3, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();

  /* パーティクル */
  for(const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    if(p.isFire) {
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}



/* ─── チュートリアル ─── */

// フェーズ1：通路を移動してゴールへ
// 通路：画面左端付近スタート → 右のゴールゾーンへ
// 上下を壁（木）で挟んだ狭い通路

function initTutorial(phase) {
  tutPhase = phase;
  tutGoalReached = false;
  enemies = [];
  beams   = [];
  particles = [];

  if(phase === 1) {
    // フェーズ1：狭い通路、移動のみ
    player = { x: 80, y: H/2, angle: 0, bodyAngle: 0 };
    // 上下の壁（木）で通路を作る（通路幅約120px）
    blocks = [];
    const wallY_top    = H/2 - 80;  // 通路上端
    const wallY_bottom = H/2 + 80;  // 通路下端
    // 上壁
    for(let x = 0; x <= W - BS; x += BS) {
      blocks.push({x, y: 0,           w: BS, h: wallY_top,         alive: true, isTutWall: true});
    }
    // 下壁
    for(let x = 0; x <= W - BS; x += BS) {
      blocks.push({x, y: wallY_bottom, w: BS, h: H - wallY_bottom,  alive: true, isTutWall: true});
    }
  } else {
    // フェーズ2：前方を塞ぐ木を撃って破壊
    player = { x: 100, y: H/2, angle: 0, bodyAngle: 0 };
    blocks = [];
    const wallY_top    = H/2 - 80;
    const wallY_bottom = H/2 + 80;
    // 上壁
    for(let x = 0; x <= W - BS; x += BS) {
      blocks.push({x, y: 0,            w: BS, h: wallY_top,        alive: true, isTutWall: true});
    }
    // 下壁
    for(let x = 0; x <= W - BS; x += BS) {
      blocks.push({x, y: wallY_bottom, w: BS, h: H - wallY_bottom, alive: true, isTutWall: true});
    }
    // 通路を塞ぐ木（撃ち抜く対象）
    const blockX = 420;
    for(let y = wallY_top; y < wallY_bottom; y += BS) {
      blocks.push({x: blockX, y, w: BS, h: BS, alive: true, isTutTarget: true});
    }
  }
}

function updateTutorial() {
  // プレイヤー移動
  const spd = PLAYER_SPEED;
  let moveX = 0, moveY = 0;
  if(keys['w']||keys['W']||keys['ArrowUp'])    moveY -= 1;
  if(keys['s']||keys['S']||keys['ArrowDown'])  moveY += 1;
  if(keys['a']||keys['A']||keys['ArrowLeft'])  moveX -= 1;
  if(keys['d']||keys['D']||keys['ArrowRight']) moveX += 1;
  if(joyActive) { moveX += joyDx; moveY += joyDy; }
  if(moveX !== 0 || moveY !== 0) {
    const len = Math.sqrt(moveX*moveX + moveY*moveY);
    player.x = Math.max(PLAYER_R, Math.min(W-PLAYER_R, player.x + (moveX/len)*spd));
    player.y = Math.max(PLAYER_R, Math.min(H-PLAYER_R, player.y + (moveY/len)*spd));
    player.bodyAngle = Math.atan2(moveY, moveX);
  }
  player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

  // ブロックとのめり込み補正
  for(const b of blocks) {
    if(!b.alive) continue;
    resolveCircleRect(player, PLAYER_R, b);
  }

  // ビーム更新（フェーズ2のみ）
  if(tutPhase === 2) {
    for(const beam of beams) {
      if(!beam.alive) continue;
      beam.x += beam.vx;
      beam.y += beam.vy;
      if(beam.x<0||beam.x>W||beam.y<0||beam.y>H) { beam.alive=false; continue; }
      for(const b of blocks) {
        if(!b.alive || b.isTutWall) continue;
        if(rectContains(b, beam.x, beam.y)) {
          b.alive = false;
          beam.alive = false;
          playSound('block');
          spawnFireParticles(beam.x, beam.y);
          break;
        }
      }
    }
    beams = beams.filter(b=>b.alive);
  }

  // パーティクル更新
  for(const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);

  // フェーズ1：ゴール判定（右端付近に到達）
  if(tutPhase === 1 && player.x > W - 120) {
    tutGoalReached = true;
    // 少し待ってフェーズ2へ
    setTimeout(() => {
      initTutorial(2);
    }, 800);
  }

  // フェーズ2：全ターゲット破壊でステージ1へ
  if(tutPhase === 2) {
    const targets = blocks.filter(b => b.isTutTarget);
    if(targets.length > 0 && targets.every(b => !b.alive)) {
      setTimeout(() => {
        showRulesOverlay();
      }, 800);
      tutPhase = 0; // 二重発火防止
    }
  }
}

function drawTutorial() {
  // 通常のゲーム描画を流用
  draw();

  // ゴールゾーン表示（フェーズ1）
  if(tutPhase === 1) {
    ctx.save();
    ctx.strokeStyle = tutGoalReached ? '#69f0ae' : '#ffd700';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(W - 120, H/2 - 80);
    ctx.lineTo(W - 120, H/2 + 80);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = tutGoalReached ? 'rgba(105,240,174,0.15)' : 'rgba(255,215,0,0.1)';
    ctx.fillRect(W - 120, H/2 - 80, 120, 160);
    ctx.fillStyle = tutGoalReached ? '#69f0ae' : '#ffd700';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GOAL', W - 60, H/2);
    ctx.restore();
  }

  // 指示テキスト
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  // 上部バー
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 56);

  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText('TUTORIAL', W/2, 8);

  ctx.fillStyle = '#fff';
  ctx.font = '15px sans-serif';
  if(tutPhase === 1) {
    ctx.fillText('WASD（または矢印キー）で戦車を移動させよう！　→　ゴールに到達せよ', W/2, 28);
  } else if(tutPhase === 2) {
    ctx.fillText('マウスで照準を合わせ、クリックでビームを発射！　→　前方の木を破壊せよ', W/2, 28);
  }

  ctx.restore();
}

/* ─── タイトル画面描画 ─── */
let titleBlink = 0; // 点滅カウンター

function drawTitle() {
  // 背景
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // 星屑
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const stars = [
    [80,60],[200,30],[400,90],[600,20],[750,70],[850,40],
    [150,150],[350,180],[550,130],[700,160],[880,100],
    [50,250],[300,280],[480,220],[660,270],[820,230],
    [100,380],[250,350],[450,400],[630,370],[800,330],
    [30,450],[370,480],[580,460],[720,490],[870,440],
  ];
  stars.forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x, y, 1 + Math.random()*0.5, 0, Math.PI*2);
    ctx.fill();
  });

  // タイトルロゴ「BURN OR DEFEND」
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // BURNの炎色グラデーション
  const grad = ctx.createLinearGradient(W/2 - 200, 0, W/2 + 200, 0);
  grad.addColorStop(0,   '#ff1744');
  grad.addColorStop(0.4, '#ff9100');
  grad.addColorStop(0.6, '#ffd600');
  grad.addColorStop(1,   '#ff6d00');

  ctx.shadowColor = '#ff6d00';
  ctx.shadowBlur = 30;
  ctx.font = 'bold 72px sans-serif';
  ctx.fillStyle = grad;
  ctx.fillText('BURN OR DEFEND', W/2, H/2 - 60);

  // サブタイトル
  ctx.shadowBlur = 0;
  ctx.font = '16px sans-serif';
  ctx.fillStyle = 'rgba(180,180,255,0.85)';
  ctx.fillText('宇宙モンスターから地球の森を守れ', W/2, H/2 + 10);

  // PRESS ANY BUTTON（点滅）
  titleBlink++;
  if(Math.floor(titleBlink / 30) % 2 === 0) {
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10;
    ctx.font = 'bold 22px sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('PRESS ANY BUTTON', W/2, H/2 + 90);
  }

  ctx.restore();
}

/* ─── ゲームループ ─── */
function loop() {
  if(state === 'title') {
    drawTitle();
  } else if(state === 'tutorial') {
    updateTutorial();
    drawTutorial();
  } else {
    update();
    draw();
  }
  animId = requestAnimationFrame(loop);
}

/* ─── オーバーレイ ─── */
function showOverlay(title, msg, btnLabel) {
  overlayTitle.textContent = title;
  overlayMsg.textContent   = msg;
  overlayBtn.textContent   = btnLabel;
  overlay.style.display    = 'block';
}

function hideOverlay() {
  overlay.style.display = 'none';
  document.getElementById('shareArea').style.display = 'none';
  document.getElementById('overlayRules').style.display = 'none';
}

function showRulesOverlay() {
  const rules = [
    '🛸 宇宙モンスターを全滅させるとステージクリア',
    '💥 モンスターに触れるとゲームオーバー',
    '🌀 モンスターが画面外に逃げると、2倍になって戻ってくる！',
    '🌲 ビームが木に当たると炎上する（なるべく外さないで！）',
    '🪵 木はモンスターを跳ね返す壁にもなる（うまく活用しよう）',
    '👾 ステージが進むと強敵（HP3）が登場する',
  ];
  const ul = document.getElementById('overlayRules');
  ul.innerHTML = rules.map(r => `<li>${r}</li>`).join('');
  ul.style.display = 'block';
  overlayTitle.textContent = 'ゲームルール';
  overlayMsg.textContent   = 'チュートリアル完了！本編を始める前に確認しよう。';
  overlayBtn.textContent   = 'ステージ１へ！';
  overlay.style.display    = 'block';
  state = 'rules';
}

/* ─── タイトル画面：任意入力でチュートリアル開始 ─── */
function startFromTitle() {
  if(state !== 'title') return;
  audioCtx.resume();
  showJoystick();
  initTutorial(1);
  state = 'tutorial';
}

/* ─── イベント ─── */
overlayBtn.addEventListener('click', () => {
  audioCtx.resume();
  showJoystick();
  if(state === 'rules') {
    // ルール確認後にステージ1へ
    stage = 0;
    initStage(0);
    hideOverlay();
    state = 'playing';
    startTimer();
  } else if(state === 'over') {
    if(stage === BOSS_STAGE) {
      initBossStage();
    } else {
      initStage(stage);
    }
    hideOverlay();
    state = 'playing';
    startTimer();
  } else if(state === 'clear') {
    if(stage === BOSS_STAGE) {
      hideOverlay();
      state = 'playing';
      startTimer();
    } else if(stage < STAGES.length) {
      hideOverlay();
      state = 'playing';
      startTimer();
    } else {
      stage = 0;
      initStage(stage);
      hideOverlay();
      state = 'playing';
      startTimer();
    }
  }
});

function triggerGameOver(reason) {
  state = 'over';
  clearInterval(timerInterval);
  playSound('gameover');
  showOverlay('ゲームオーバー', reason + '\nもう一度挑戦しよう！', 'リトライ');
}

/* ─── 起動 ─── */
state = 'title';
loop();
</script>
</body>
</html>
